<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mall_portal</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 恢复从 404.html 中转回来的目标路由（仅处理属于用户端的路径）
      ;(function () {
        var t = sessionStorage.getItem('spa-redirect')
        if (!t) return
        sessionStorage.removeItem('spa-redirect')
        if (t.indexOf('/seecen-mall/admin') === 0) return
        history.replaceState(null, '', t)
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
